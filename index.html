<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vélo 3D – décor OpenStreetMap</title>
<style>
:root{--fg:#10202b;--card:rgba(255,255,255,.88);--bd:rgba(16,32,43,.18);--ac:#0b6e8a;--acfg:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#eaf3f7;--card:rgba(14,26,34,.86);--bd:rgba(234,243,247,.22);--ac:#52c7e6;--acfg:#06222c;color-scheme:dark}}
:root[data-theme="dark"]{--fg:#eaf3f7;--card:rgba(14,26,34,.86);--bd:rgba(234,243,247,.22);--ac:#52c7e6;--acfg:#06222c;color-scheme:dark}
html,body{height:100%;margin:0;background:#9fd0ff;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0}
.m{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 8px;text-align:center;backdrop-filter:blur(6px)}
.m b{display:block;font-size:clamp(26px,9vw,44px);line-height:1.05;font-variant-numeric:tabular-nums}
.m i{font-style:normal;font-size:clamp(13px,3.8vw,16px);opacity:.8}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);backdrop-filter:blur(8px)}
#msg{min-height:1.3em;font-size:15px;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:16px;white-space:nowrap}
input[type=range]{flex:1;height:36px;accent-color:var(--ac)}
button{flex:1;min-width:0;min-height:54px;padding:0 4px;font:600 15px system-ui,sans-serif;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
#pp{position:fixed;inset:0;z-index:8;background:var(--card);padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(8px)}
#pp.hide{display:none}
#pt{flex:1;font-size:15px;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:12px;padding:8px}
#pe{min-height:1.3em;font-size:15px}
#home{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);backdrop-filter:blur(10px)}
#home.hide{display:none}
#home h1{margin:0;font-size:28px}#home p{margin:0;font-size:16px}
#home .row{margin:0}
button.wide{flex:none;width:100%}
button:disabled{opacity:.45}
#pb{height:16px;border-radius:8px;border:1px solid var(--bd);overflow:hidden}
#pf{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#hs{min-height:3em;font-size:15px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hide{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="m"><b id="sp">0</b><i>km/h</i></div>
  <div class="m"><b id="po">0</b><i>watts</i></div>
  <div class="m"><b id="gr">0</b><i>pente %</i></div>
  <div class="m"><b id="di">0.0</b><i>km</i></div>
  <div class="m"><b id="hr">–</b><i>bpm</i></div>
  <div class="m"><b id="ca">–</b><i>tr/min</i></div>
</div>
<div id="bar">
  <div id="msg">Parcours de démonstration chargé. Règle la puissance ou connecte ton trainer.</div>
  <div class="row" id="sl"><label>Puissance simulée <b id="pv">150</b> W</label><input id="pw" type="range" min="0" max="500" step="5" value="150"></div>
  <div class="row">
    <button id="bt">Trainer</button><button id="hb">Cardio</button><button id="mn">Menu</button>
  </div>
</div>
<input id="fi" type="file" class="hide">
<div id="home">
  <h1>Vélo 3D</h1>
  <p>Choisis un GPX : le décor OpenStreetMap est préparé avant le départ.</p>
  <div class="row"><button id="gp">Choisir un GPX</button><button id="pg">Coller un GPX</button></div>
  <button id="dm" class="wide">Parcours de démonstration</button>
  <div id="pb"><i id="pf"></i></div>
  <div id="hs"></div>
  <button id="go" class="wide on" disabled>Lancer le parcours</button>
</div>
<div id="pp" class="hide"><textarea id="pt" placeholder="Colle ici le contenu complet du fichier GPX"></textarea><div id="pe"></div><div class="row"><button id="pl">Charger</button><button id="px">Annuler</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id), ST=8, MASS=85, CDA=.32, RHO=1.2, CRR=.004, G0=9.81;
const toast=t=>{$('msg').textContent=t;$('hs').textContent=t};
const prog=(f,t)=>{$('pf').style.width=Math.round(f*100)+'%';toast(t)};

/* ---------- Scène ---------- */
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const S=new THREE.Scene(); S.background=new THREE.Color(0x9fd0ff); S.fog=new THREE.Fog(0x9fd0ff,90,520);
const cam=new THREE.PerspectiveCamera(65,1,.5,1500);
S.add(new THREE.HemisphereLight(0xffffff,0x4f6a3a,1.05));
const sun=new THREE.DirectionalLight(0xffffff,.55); sun.position.set(120,200,60); S.add(sun);
const rider=new THREE.Mesh(new THREE.BoxGeometry(.5,1,1.7),new THREE.MeshLambertMaterial({color:0xe4572e}));
S.add(rider);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- Parcours ---------- */
let route=null, world=null, proj=null, s=0, v=0, running=false;
function sm(a,w){const c=a.slice();for(let i=0;i<a.length;i++){let t=0,k=0;for(let q=-w;q<=w;q++){const m=i+q;if(m>=0&&m<a.length){t+=c[m];k++}}a[i]=t/k}}
function build(raw){
  const L=[0];for(let i=1;i<raw.length;i++)L[i]=L[i-1]+Math.hypot(raw[i].x-raw[i-1].x,raw[i].z-raw[i-1].z);
  const tot=L[L.length-1], n=Math.max(2,Math.floor(tot/ST)), X=[],Y=[],Z=[]; let j=0;
  for(let i=0;i<=n;i++){
    const d=Math.min(i*ST,tot); while(j<raw.length-2&&L[j+1]<d)j++;
    const a=raw[j],b=raw[j+1],t=(d-L[j])/((L[j+1]-L[j])||1);
    X.push(a.x+(b.x-a.x)*t);Y.push(a.y+(b.y-a.y)*t);Z.push(a.z+(b.z-a.z)*t);
  }
  sm(Y,3);sm(Y,3);sm(X,2);sm(Z,2);
  const G=Y.map((_,i)=>{const a=Math.max(0,i-1),b=Math.min(n,i+1);return Math.max(-.2,Math.min(.2,(Y[b]-Y[a])/((b-a)*ST)))});sm(G,2);
  route={X,Y,Z,G,n,len:n*ST}; makeWorld(); s=0; v=0; place(true); if(proj){$('go').disabled=true;prog(0,'Préparation du décor OpenStreetMap…');setTimeout(()=>loadOSM().catch(e=>{toast('Décor OpenStreetMap : '+e.message+'. Tu peux lancer sans décor.');$('go').disabled=false}),0)}
  else{$('go').disabled=false;prog(1,'Parcours prêt (sans décor OpenStreetMap).')}
}
function demo(){proj=null;osmTok++;
  const raw=[];let x=0,z=0,h=0;
  for(let i=0;i<500;i++){h+=Math.sin(i*.035)*.045+.006;x+=Math.cos(h)*10;z+=Math.sin(h)*10;raw.push({x,z,y:30*Math.sin(i*.02)+8*Math.sin(i*.06)})}
  build(raw);
}
function makeWorld(){
  if(world){S.remove(world);world.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  world=new THREE.Group(); const {X,Y,Z,n}=route;
  const T=i=>{const a=Math.max(0,i-1),b=Math.min(n,i+1),dx=X[b]-X[a],dz=Z[b]-Z[a],l=Math.hypot(dx,dz)||1;return[-dz/l,dx/l]};
  const ribbon=(w,dy,colFn)=>{
    const pos=[],col=[],idx=[];
    for(let i=0;i<=n;i++){const[nx,nz]=T(i);for(const sd of[-1,1]){pos.push(X[i]+nx*w*sd,Y[i]+dy,Z[i]+nz*w*sd);col.push(...colFn(i))}
      if(i<n){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2)}}
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    g.setIndex(idx);g.computeVertexNormals();
    return new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}));
  };
  world.add(ribbon(45,-.4,()=>[.27,.5,.22]));
  world.add(ribbon(3.2,0,i=>i%8<4?[.27,.27,.3]:[.35,.35,.38]));
  const base=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),new THREE.MeshLambertMaterial({color:0x3c6632}));
  base.rotation.x=-Math.PI/2;base.position.set(X[0],Math.min(...Y)-8,Z[0]);world.add(base);
  const tg=new THREE.ConeGeometry(2,7,6);tg.translate(0,3.5,0);
  const N=400, im=new THREE.InstancedMesh(tg,new THREE.MeshLambertMaterial({color:0x2c6f39}),N), M=new THREE.Matrix4();
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let k=0;k<N;k++){
    const i=Math.floor(rnd()*n),[nx,nz]=T(i),o=(7+rnd()*35)*(rnd()<.5?-1:1),sc=.7+rnd()*1.1;
    M.makeScale(sc,sc,sc);M.setPosition(X[i]+nx*o,Y[i]-.4,Z[i]+nz*o);im.setMatrixAt(k,M);
  }
  world.add(im);world.userData.rt=im;S.add(world);
}
function at(d){
  const f=Math.min(Math.max(d,0),route.len-.001)/ST,i=Math.floor(f),t=f-i,{X,Y,Z,G}=route;
  return[X[i]+(X[i+1]-X[i])*t,Y[i]+(Y[i+1]-Y[i])*t,Z[i]+(Z[i+1]-Z[i])*t,G[i]];
}
function place(snap){
  const p=at(s),a=at(s-7),b=at(s+12),c=at(s+1);
  rider.position.set(p[0],p[1]+.6,p[2]);rider.rotation.y=Math.atan2(c[0]-p[0],c[2]-p[2]);
  const tgt=new THREE.Vector3(a[0],a[1]+2.8,a[2]);
  if(snap)cam.position.copy(tgt);else cam.position.lerp(tgt,.2);
  cam.lookAt(b[0],b[1]+1,b[2]);
}


/* ---------- Décor OpenStreetMap (Overpass, par tranches) ---------- */
let osmTok=0;
const SERVERS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.openstreetmap.fr/api/interpreter','https://overpass.kumi.systems/api/interpreter'],CH=1500,CAP=25000;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let live=[];
async function post(u,qq,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(qq),signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  catch(e){throw new Error(e.name==='AbortError'?'délai dépassé':e.message)}
  finally{clearTimeout(t)}
}
async function probe(){
  toast('Test des serveurs OpenStreetMap…');
  const res=await Promise.all(SERVERS.map(async u=>{const t0=performance.now();try{await post(u,'[out:json][timeout:5];node(1);out;',8000);return{u,ms:performance.now()-t0}}catch(e){return{u,err:e.message}}}));
  live=res.filter(r=>!r.err).sort((a,b)=>a.ms-b.ms).map(r=>r.u);
  return res;
}
async function ask(qq){
  let err='';
  for(const u of live.slice()){
    try{return await post(u,qq,20000)}catch(e){err=e.message;live=live.filter(x=>x!==u).concat(u)}
  }
  throw new Error(err||'aucun serveur');
}
async function loadOSM(){
  const tok=++osmTok,{la,lo,kx,kz}=proj,total=Math.min(route.len,CAP),N=Math.max(1,Math.ceil(total/CH)),seen=new Set(),els=[];
  let fails=0,bad=0,lastErr='';
  const res=await probe();
  if(tok!==osmTok)return;
  if(!live.length){prog(0,'Aucun serveur OpenStreetMap joignable depuis cette page ('+res.map(r=>new URL(r.u).host+' : '+r.err).join(' ; ')+'). Si la page est ouverte depuis content://, héberge-la en HTTPS. Tu peux lancer sans décor.');$('go').disabled=false;return}
  toast('Serveurs joignables : '+live.map(u=>new URL(u).host).join(', '));await wait(600);
  for(let k=0;k<N;k++){
    if(tok!==osmTok)return;
    const d0=k*CH,d1=Math.min(total,d0+CH),pts=[];
    for(let d=d0;d<=d1+99;d+=100){const p=at(Math.min(d,d1));pts.push((la-p[2]/kz).toFixed(5),(lo+p[0]/kx).toFixed(5))}
    const L=pts.join(',');
    const q=`[out:json][timeout:20];(way["building"](around:120,${L});way["natural"~"^(water|wood)$"](around:150,${L});way["landuse"="forest"](around:150,${L});way["highway"](around:90,${L}););out geom 3000;`;
    try{
      const js=await ask(q);
      for(const e of js.elements||[])if(!seen.has(e.id)){seen.add(e.id);els.push(e)}
      fails=0;
    }catch(e){fails++;bad++;lastErr=e.message;if(fails>=3)break}
    prog((k+1)/N,'Décor OpenStreetMap : tranche '+(k+1)+'/'+N+' · '+els.length+' éléments'+(fails?' (erreur : '+lastErr+')':''));
    await wait(400);
  }
  if(tok!==osmTok)return;
  const lim=route.len>CAP?' (25 premiers km)':'';
  if(!els.length){prog(1,'Aucun décor reçu'+(lastErr?' ('+lastErr+')':'')+'. Tu peux lancer sans décor.');$('go').disabled=false;return}
  prog(1,'Construction du décor 3D…');await wait(50);
  const r=applyOSM(els);
  prog(1,'Décor prêt : '+r.b+' bâtiments, '+r.w+' plans d’eau, '+r.t+' arbres, '+r.r+' routes'+lim+(bad?' · '+bad+' tranche(s) manquante(s)':'')+'.');
  $('go').disabled=false;
}
function applyOSM(els){
  const {X,Y,Z,n}=route,{la,lo,kx,kz}=proj,B=[],W=[],F=[],H=[];
  for(const e of els){
    const gm=(e.geometry||[]).filter(p=>p&&p.lon!=null&&p.lat!=null);
    if(gm.length<2)continue;
    const t=e.tags||{},c=gm.map(p=>[(p.lon-lo)*kx,-(p.lat-la)*kz]);
    if(t.building)B.push([c,t]);else if(t.natural==='water')W.push(c);
    else if(t.natural==='wood'||t.landuse==='forest')F.push(c);else if(t.highway)H.push(c);
  }
  const ny=(x,z)=>{let b=1e18,y=0;for(let i=0;i<=n;i+=2){const d=(X[i]-x)**2+(Z[i]-z)**2;if(d<b){b=d;y=Y[i]}}return y};
  const shape=c=>new THREE.Shape(c.map(p=>new THREE.Vector2(p[0],-p[1])));
  const flat=g=>{g.rotateX(-Math.PI/2);return g.index?g.toNonIndexed():g};
  const add=(parts,col)=>{
    if(!parts.length)return;let len=0;parts.forEach(a=>len+=a.length);
    const a=new Float32Array(len);let o=0;parts.forEach(p=>{a.set(p,o);o+=p.length});
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));g.computeVertexNormals();
    world.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide})));
  };
  const bp=[];
  for(const[c,t]of B.slice(0,700)){
    if(c.length<4)continue;
    const h=+t.height||(+t['building:levels']||2)*3.2,y0=ny(c[0][0],c[0][1])-.4;
    const g=flat(new THREE.ExtrudeGeometry(shape(c),{depth:Math.min(h,60),bevelEnabled:false}));
    g.translate(0,y0,0);bp.push(g.attributes.position.array);g.dispose();
  }
  add(bp,0xd9d0c4);
  const wp=[];
  for(const c of W.slice(0,150)){
    if(c.length<4)continue;
    const g=flat(new THREE.ShapeGeometry(shape(c)));g.translate(0,ny(c[0][0],c[0][1])-.15,0);
    wp.push(g.attributes.position.array);g.dispose();
  }
  add(wp,0x3b87c7);
  const inside=(c,x,z)=>{let r=false;for(let i=0,j=c.length-1;i<c.length;j=i++){const a=c[i],b=c[j];if((a[1]>z)!==(b[1]>z)&&x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])r=!r}return r};
  const tr=[];
  for(const c of F){
    let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
    for(const p of c){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);z0=Math.min(z0,p[1]);z1=Math.max(z1,p[1])}
    const tries=Math.min(250,((x1-x0)*(z1-z0))/500|0);
    for(let k=0;k<tries&&tr.length<1800;k++){const x=x0+Math.random()*(x1-x0),z=z0+Math.random()*(z1-z0);if(inside(c,x,z))tr.push([x,z])}
  }
  if(tr.length){
    const tg=new THREE.ConeGeometry(2,7,6);tg.translate(0,3.5,0);
    const im=new THREE.InstancedMesh(tg,new THREE.MeshLambertMaterial({color:0x2c6f39}),tr.length),M=new THREE.Matrix4();
    tr.forEach((p,i)=>{const sc=.7+Math.random();M.makeScale(sc,sc,sc);M.setPosition(p[0],ny(p[0],p[1])-.4,p[1]);im.setMatrixAt(i,M)});
    world.add(im);if(world.userData.rt)world.userData.rt.visible=false;
  }
  const lp=[];
  for(const c of H.slice(0,600)){const y=ny(c[0][0],c[0][1])-.3;for(let i=1;i<c.length;i++)lp.push(c[i-1][0],y,c[i-1][1],c[i][0],y,c[i][1])}
  if(lp.length){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));world.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x7a7a7a})))}
  return{b:Math.min(B.length,700),w:Math.min(W.length,150),t:tr.length,r:H.length};
}

/* ---------- GPX ---------- */
function parseGPX(txt){
  txt=String(txt).replace(/^\uFEFF/,'').trim();
  const num=(h,k)=>{const m=(k==='lat'?/\blat\s*=\s*["']([-+0-9.eE]+)["']/:/\blon\s*=\s*["']([-+0-9.eE]+)["']/).exec(h);return m?+m[1]:NaN};
  const P=[];
  for(const tag of['trkpt','rtept','wpt']){
    for(const ch of txt.split(new RegExp('<(?:\\w+:)?'+tag+'\\b')).slice(1)){
      const head=ch.slice(0,ch.indexOf('>')+1),la=num(head,'lat'),lo=num(head,'lon'),e=ch.match(/<(?:\w+:)?ele>\s*([-+0-9.eE]+)/);
      if(isFinite(la)&&isFinite(lo))P.push({lat:la,lon:lo,ele:e?+e[1]:0});
    }
    if(P.length>=2)break;
    P.length=0;
  }
  if(P.length<2)throw new Error('Aucun point de trace trouvé (texte de '+txt.length+' caractères, début : « '+txt.slice(0,50).replace(/\s+/g,' ')+' »).');
  const la=P[0].lat,lo=P[0].lon,kx=111320*Math.cos(la*Math.PI/180),kz=110540;
  proj={la,lo,kx,kz};
  return P.map(p=>({x:(p.lon-lo)*kx,z:-(p.lat-la)*kz,y:p.ele}));
}
$('gp').onclick=()=>$('fi').click();
$('fi').onchange=async e=>{
  const f=e.target.files[0];if(!f){toast('Aucun fichier reçu.');return}
  toast('Lecture de '+f.name+'…');
  try{build(parseGPX(await f.text()));toast('Parcours chargé : '+(route.len/1000).toFixed(1)+' km.')}catch(err){toast('GPX illisible : '+err.message)}
  e.target.value='';
};
$('pg').onclick=()=>{$('pe').textContent='';$('pp').classList.remove('hide')};
$('px').onclick=()=>$('pp').classList.add('hide');
$('pl').onclick=()=>{
  try{build(parseGPX($('pt').value));$('pp').classList.add('hide');toast('Parcours chargé : '+(route.len/1000).toFixed(1)+' km.')}
  catch(err){$('pe').textContent='GPX illisible : '+err.message}
};
$('dm').onclick=()=>{demo();toast('Parcours de démonstration chargé.')};

/* ---------- Bluetooth (FTMS + cardio) ---------- */
let ctl=null,lastP=0,hr=0,cad=0,busy=false;
function onBike(e){
  const d=e.target.value,f=d.getUint16(0,true);let o=2;
  if(!(f&1))o+=2; if(f&2)o+=2; if(f&4){cad=d.getUint16(o,true)/2;o+=2}
  if(f&8)o+=2; if(f&16)o+=3; if(f&32)o+=2; if(f&64)lastP=d.getInt16(o,true);
}
async function sendGrade(g){
  if(!ctl||busy)return;busy=true;
  const b=new DataView(new ArrayBuffer(7));
  b.setUint8(0,0x11);b.setInt16(1,0,true);b.setInt16(3,Math.round(g*10000),true);b.setUint8(5,40);b.setUint8(6,51);
  try{await ctl.writeValueWithResponse(b)}catch(e){}
  busy=false;
}
$('bt').onclick=async()=>{
  if(!navigator.bluetooth){toast('Bluetooth indisponible ici. Ouvre cette page dans Chrome sur Android.');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[0x1826]}]});
    dev.addEventListener('gattserverdisconnected',()=>{ctl=null;lastP=0;$('bt').classList.remove('on');$('sl').classList.remove('hide');toast('Trainer déconnecté.')});
    const sv=await (await dev.gatt.connect()).getPrimaryService(0x1826);
    const ib=await sv.getCharacteristic(0x2AD2);ib.addEventListener('characteristicvaluechanged',onBike);await ib.startNotifications();
    const cp=await sv.getCharacteristic(0x2AD9);
    try{await cp.startNotifications()}catch(e){}
    await cp.writeValueWithResponse(Uint8Array.of(0x00));await cp.writeValueWithResponse(Uint8Array.of(0x07));
    ctl=cp;$('bt').classList.add('on');$('sl').classList.add('hide');toast('Trainer connecté : pédale pour avancer.');
  }catch(e){toast('Trainer : '+e.message)}
};
$('hb').onclick=async()=>{
  if(!navigator.bluetooth){toast('Bluetooth indisponible ici. Ouvre cette page dans Chrome sur Android.');return}
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[0x180D]}]});
    const sv=await (await dev.gatt.connect()).getPrimaryService(0x180D),c=await sv.getCharacteristic(0x2A37);
    c.addEventListener('characteristicvaluechanged',e=>{const d=e.target.value;hr=(d.getUint8(0)&1)?d.getUint16(1,true):d.getUint8(1)});
    await c.startNotifications();$('hb').classList.add('on');toast('Cardio connecté.');
  }catch(e){toast('Cardio : '+e.message)}
};
setInterval(()=>{if(route&&ctl)sendGrade(at(s)[3])},1500);
$('go').onclick=()=>{$('home').classList.add('hide');running=true};
$('mn').onclick=()=>{running=false;$('home').classList.remove('hide')};
$('pw').oninput=e=>{$('pv').textContent=e.target.value};

/* ---------- Boucle ---------- */
let last=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-last)/1000,.1);last=t;
  if(route){
    const P=ctl?lastP:+$('pw').value, g=at(s)[3], th=Math.atan(g);
    const F=MASS*G0*(CRR*Math.cos(th)+Math.sin(th))+.5*RHO*CDA*v*v;
    if(running){v=Math.max(0,v+((P*.975/Math.max(v,1.5)-F)/MASS)*dt);s+=v*dt;if(s>=route.len)s-=route.len}
    place(false);
    $('sp').textContent=Math.round(v*3.6);$('po').textContent=Math.round(P);
    $('gr').textContent=(g*100).toFixed(1);$('di').textContent=(s/1000).toFixed(1);
    $('hr').textContent=hr||'–';$('ca').textContent=ctl&&cad?Math.round(cad):'–';
  }
  R.render(S,cam);
}
demo();requestAnimationFrame(loop);
</script>
